<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script type="module" src="model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; --progress-bar-color: #8ab4f8; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         font: 15px sans-serif; color: #c00; text-align: center; padding: 24px; }
</style>
</head>
<body>
<model-viewer id="mv" camera-controls touch-action="none" auto-rotate auto-rotate-delay="2000"
  rotation-per-second="18deg" shadow-intensity="0.8" exposure="1.05" environment-image="neutral"
  interaction-prompt="none" min-camera-orbit="auto auto 1%" max-camera-orbit="auto auto 400%"></model-viewer>
<div id="err">Modell konnte nicht geladen werden.</div>
<script>
  const p = new URLSearchParams(location.search);
  const mv = document.getElementById('mv');
  mv.addEventListener('error', () => { document.getElementById('err').style.display = 'flex'; });
  mv.src = p.get('src');
</script>
</body>
</html>
